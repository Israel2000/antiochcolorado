<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Antioch Church of Colorado</title>
    <style>
      /* First-paint loading screen: shows instantly, before the app
         bundle loads, so the page is never a blank white screen. Angular
         replaces this content automatically once the app starts. */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        background: #fffaf3;
        color: #7c4a21;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e8d9c3;
        border-top-color: #7c4a21;
        border-radius: 50%;
        animation: app-spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-loading h1 {
        font-size: 1.4rem;
        margin: 0 0 8px;
      }
      .app-loading p {
        color: #8a7a68;
        margin: 0;
      }
    </style>
    <base href="/" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <app-root>
      <div class="app-loading">
        <div class="spinner"></div>
        <h1>Antioch Church of Colorado</h1>
        <p>Loading…</p>
      </div>
    </app-root>
  </body>
</html>
